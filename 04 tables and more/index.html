    <title>Tables</title>
    <style>
        /* This is CSS*/
        /* This is a CSS comment*/
        /*This rule targets tables, th, and td elements*/
        table, th, td{
            border: 1px solid black;
        }
        td{
            border: 1px solid darkgrey;
        }
        /*This rule is only for tables*/
        table{
            border-collapse: collapse;
        }

        /* This rule is for th and td elements*/
        th, td{
            padding: 5px;
            text-align: center;
        }
        thead{
            background-color: lightgray;
        }
        tbody{
            background-color: black;
            color: white;
        }
    </style>
</head>
